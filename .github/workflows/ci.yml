name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: syco23
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d syco23"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bootstrap Supabase-compatible test roles
        env:
          PGPASSWORD: postgres
        run: |
          psql --host localhost --username postgres --dbname syco23 --set ON_ERROR_STOP=1 --file ../../docker/postgres/000-supabase-compat.sql
          psql --host localhost --username postgres --dbname syco23 --set ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin;
            end if;
          end
          $$;
          create schema if not exists auth;
          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          SQL
      - name: Apply migrations in deterministic order
        env:
          PGPASSWORD: postgres
        run: |
          for migration in ../../supabase/migrations/*.sql; do
            psql --host localhost --username postgres --dbname syco23 --set ON_ERROR_STOP=1 --file "$migration"
          done
      - run: PYTHONPATH=. TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/syco23 pytest tests -q
      - run: python -m compileall app

  minio-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned MinIO server image
        run: >-
          docker build
          --file docker/minio.Dockerfile
          --build-arg MINIO_VERSION=RELEASE.2025-10-15T17-29-55Z
          --build-arg MINIO_COMMIT=9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
          --tag syco23-minio-ci
          .
      - name: Verify MinIO release identity
        run: |
          version="$(docker run --rm --entrypoint sh syco23-minio-ci -c 'minio --version')"
          printf '%s\n' "$version"
          printf '%s\n' "$version" | grep -F "RELEASE.2025-10-15T17-29-55Z"
          if printf '%s\n' "$version" | grep -F "DEVELOPMENT.GOGET"; then
            echo "MinIO binary does not contain release metadata" >&2
            exit 1
          fi

  audio-processing-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build media worker image
        run: docker build -f docker/worker.Dockerfile -t syco23-worker-audio-ci .
      - name: Verify FFmpeg runtime and MP3 encoder
        run: |
          docker run --rm --entrypoint sh syco23-worker-audio-ci -c "ffmpeg -version"
          docker run --rm --entrypoint sh syco23-worker-audio-ci -c "ffprobe -version"
          docker run --rm --entrypoint sh syco23-worker-audio-ci -c "ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libmp3lame"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Enforce complete dependency audit
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build