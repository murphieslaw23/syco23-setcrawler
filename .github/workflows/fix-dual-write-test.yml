name: fix-dual-write-test

on:
  push:
    branches:
      - feat/v0.3-provider-dual-write
    paths:
      - .github/workflows/fix-dual-write-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.3-provider-dual-write
          fetch-depth: 0
      - name: Keep the PostgreSQL fixture JSON-serializable
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/tests/test_provider_dual_write.py')
          text = path.read_text()
          text = text.replace('from pathlib import Path\n', '')
          old = '''            "nested": {
                "media_bytes": b"forbidden",
                "license": "metadata-only",
            },
            "filesystem": Path("/tmp/forbidden.mp3"),
'''
          new = '''            "nested": {
                "media_bytes": "forbidden-provider-field",
                "license": "metadata-only",
            },
'''
          if text.count(old) != 1:
              raise SystemExit('expected one non-JSON fixture block')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-dual-write-test.yml').unlink()
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/tests/test_provider_dual_write.py .github/workflows/fix-dual-write-test.yml
          git commit -m "test: keep provider dual-write fixture JSON-compatible"
          git push origin HEAD:feat/v0.3-provider-dual-write
