name: lockfile-refresh

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-web-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Regenerate npm lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install contract
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "fix(web): synchronize npm lockfile"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
