name: nuxt-type-debug

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Inspect generated app-config types
        run: |
          grep -R -n "sycoRuntime" .nuxt node_modules/@nuxt node_modules/nuxt 2>/dev/null | head -100 || true
          find .nuxt -type f -iname '*app*config*' -print
      - run: npm run typecheck
