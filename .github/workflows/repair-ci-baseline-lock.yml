name: repair-ci-baseline-lock

on:
  push:
    branches:
      - fix/ci-baseline-2026-08-08
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'fix/ci-baseline-2026-08-08'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-baseline-2026-08-08
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Patch only advisory-affected transitive lock nodes
        working-directory: apps/web
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'package-lock.json'
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'))
          const patches = {
            'node_modules/nanoid': {
              from: '3.3.16',
              version: '3.3.17',
              resolved: 'https://registry.npmjs.org/nanoid/-/nanoid-3.3.17.tgz',
              integrity: 'sha512-xQLf0A3HOMlgHq0n247/LRuAOYmB7dXJ/DvAxGvsSBij45XtBSmQycu+F8ODbHwns/XyFZagyL1+J0Offw1E0g=='
            },
            'node_modules/brace-expansion': {
              from: '2.1.3',
              version: '2.1.4',
              resolved: 'https://registry.npmjs.org/brace-expansion/-/brace-expansion-2.1.4.tgz',
              integrity: 'sha512-hGfVzPxthbf3+2yjg/RBs60cB0FhqBS/zvdV/4wn4/BmN0bNMMHPc4V/BbFieqf1TKAGGAHnY4eSjajCl0f2Xg=='
            },
            'node_modules/@vercel/nft/node_modules/brace-expansion': {
              from: '5.0.8',
              version: '5.0.9',
              resolved: 'https://registry.npmjs.org/brace-expansion/-/brace-expansion-5.0.9.tgz',
              integrity: 'sha512-ScQ4IuvIEF1TMlP7Zt+vjJ//9zlPb2SDcxWxM3bk8s6t6GGdJ7KO1dCcTidOPJKePW30LE/2cT7wCyPho9/Wxg=='
            }
          }
          for (const [key, patch] of Object.entries(patches)) {
            const current = lock.packages[key]
            if (!current || current.version !== patch.from) {
              throw new Error(`${key}: expected ${patch.from}, got ${current?.version}`)
            }
            current.version = patch.version
            current.resolved = patch.resolved
            current.integrity = patch.integrity
          }
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`)
          NODE
      - name: Verify clean install and high-severity audit
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "Lockfile already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "fix(web): patch transitive audit advisories"
          git push origin HEAD:fix/ci-baseline-2026-08-08
