name: runner-smoke

on:
  push:
    branches:
      - feat/v0.2.1-release-gate
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm GitHub-hosted runner allocation
        run: |
          echo "runner-ok"
          uname -a
