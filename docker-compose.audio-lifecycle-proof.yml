services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: syco23
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PROOF_POSTGRES_PASSWORD:?PROOF_POSTGRES_PASSWORD is required}"
    ports: []
    volumes:
      - proof_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/000-supabase-compat.sql:/docker-entrypoint-initdb.d/000-supabase-compat.sql:ro
      - ./docker/postgres/001-run-all-migrations.sh:/docker-entrypoint-initdb.d/001-run-all-migrations.sh:ro
      - ./supabase/migrations:/syco23-migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syco23"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: []
    volumes:
      - proof_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: syco23-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
        MINIO_COMMIT: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      MINIO_BROWSER: "off"
    ports: []
    expose:
      - "9000"
    volumes:
      - proof_minio_data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 20

  audio-storage-init:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "app.cli.init_audio_storage"]
    restart: "no"
    environment:
      ENVIRONMENT: fixture
      REPOSITORY_MODE: memory
      AUTH_MODE: local
      AUDIO_STORAGE_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      MINIO_SECURE: "false"
      AUDIO_MAX_OBJECT_BYTES: "10485760"
      AUDIO_MULTIPART_PART_SIZE_BYTES: "5242880"
    depends_on:
      minio:
        condition: service_healthy

  worker-audio-lifecycle:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - -Q
      - audio-lifecycle
      - --concurrency=1
      - --loglevel=INFO
    environment:
      ENVIRONMENT: local
      REPOSITORY_MODE: postgres
      AUTH_MODE: local
      LOCAL_USER_ROLE: admin
      DATABASE_URL: "postgresql://postgres:${PROOF_POSTGRES_PASSWORD:?PROOF_POSTGRES_PASSWORD is required}@db:5432/syco23"
      REDIS_URL: redis://redis:6379/0
      AUDIO_STORAGE_ENABLED: "true"
      AUDIO_LIFECYCLE_EXECUTOR_ENABLED: "true"
      AUDIO_LIFECYCLE_BATCH_SIZE: "5"
      AUDIO_LIFECYCLE_MAX_ATTEMPTS: "3"
      AUDIO_LIFECYCLE_RETRY_DELAY_SECONDS: "5"
      AUDIO_LIFECYCLE_CLAIM_TIMEOUT_SECONDS: "30"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      MINIO_SECURE: "false"
      AUDIO_MAX_OBJECT_BYTES: "10485760"
      AUDIO_MULTIPART_PART_SIZE_BYTES: "5242880"
      SERVICE_COMPONENT: worker-audio-lifecycle-proof
      AUDIO_LIFECYCLE_PROOF_ACK: "${AUDIO_LIFECYCLE_PROOF_ACK:?AUDIO_LIFECYCLE_PROOF_ACK is required}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      audio-storage-init:
        condition: service_completed_successfully

volumes:
  proof_postgres_data:
  proof_redis_data:
  proof_minio_data:
