name: syco23-setcrawler-production

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-backend-environment: &backend-environment
  ENVIRONMENT: production
  REPOSITORY_MODE: postgres
  AUTH_MODE: supabase
  DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
  SUPABASE_URL: "${SUPABASE_URL:?SUPABASE_URL is required}"
  SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}"
  SUPABASE_JWT_AUDIENCE: "${SUPABASE_JWT_AUDIENCE:-authenticated}"
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS is required}"
  PROVIDER_MODE: "${PROVIDER_MODE:-fixture}"
  YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
  ARCHIVE_ORG_ENABLED: "${ARCHIVE_ORG_ENABLED:-false}"
  MIXCLOUD_ENABLED: "${MIXCLOUD_ENABLED:-false}"
  AUDIUS_ENABLED: "${AUDIUS_ENABLED:-false}"
  AUDIUS_API_BEARER_TOKEN: "${AUDIUS_API_BEARER_TOKEN:-}"
  RSS_ENABLED: "${RSS_ENABLED:-false}"
  RSS_TRUSTED_FEEDS_JSON: "${RSS_TRUSTED_FEEDS_JSON:-}"
  SCRAPER_USER_AGENT: "${SCRAPER_USER_AGENT:-syco23-setcrawler/0.2 (+contact: operations@example.com)}"
  SCRAPER_REQUEST_DELAY_MS: "${SCRAPER_REQUEST_DELAY_MS:-5000}"
  FTM_SCRAPER_ENABLED: "${FTM_SCRAPER_ENABLED:-false}"
  FTM_MAX_PAGES_PER_RUN: "${FTM_MAX_PAGES_PER_RUN:-25}"
  PROVIDER_REQUEST_TIMEOUT_SECONDS: "${PROVIDER_REQUEST_TIMEOUT_SECONDS:-20}"
  PROVIDER_OUTPUT_LIMIT_BYTES: "${PROVIDER_OUTPUT_LIMIT_BYTES:-1048576}"
  YT_DLP_BIN: "${YT_DLP_BIN:-yt-dlp}"
  AUDIO_STORAGE_ENABLED: "${AUDIO_STORAGE_ENABLED:-false}"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-}"
  MINIO_SECURE: "false"
  AUDIO_MAX_OBJECT_BYTES: "${AUDIO_MAX_OBJECT_BYTES:-4294967296}"
  AUDIO_MULTIPART_PART_SIZE_BYTES: "${AUDIO_MULTIPART_PART_SIZE_BYTES:-16777216}"
  JOB_CLAIM_TTL_SECONDS: "${JOB_CLAIM_TTL_SECONDS:-300}"
  JOB_REDRIVE_INTERVAL_SECONDS: "${JOB_REDRIVE_INTERVAL_SECONDS:-60}"
  JOB_REDRIVE_BATCH_SIZE: "${JOB_REDRIVE_BATCH_SIZE:-100}"
  HEALTH_PROBE_TIMEOUT_SECONDS: "${HEALTH_PROBE_TIMEOUT_SECONDS:-1}"
  HEALTH_PROBE_CACHE_SECONDS: "${HEALTH_PROBE_CACHE_SECONDS:-10}"
  BEAT_STALE_AFTER_SECONDS: "${BEAT_STALE_AFTER_SECONDS:-180}"
  DEAD_LETTER_ALERT_THRESHOLD: "${DEAD_LETTER_ALERT_THRESHOLD:-1}"
  STUCK_JOB_ALERT_THRESHOLD: "${STUCK_JOB_ALERT_THRESHOLD:-1}"
  REDRIVE_FAILURE_ALERT_THRESHOLD: "${REDRIVE_FAILURE_ALERT_THRESHOLD:-1}"
  PROVIDER_FAILURE_ALERT_THRESHOLD: "${PROVIDER_FAILURE_ALERT_THRESHOLD:-1}"

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: docker/worker.Dockerfile
  restart: unless-stopped
  environment:
    <<: *backend-environment
  read_only: true
  tmpfs:
    - /tmp:size=64m,noexec,nosuid
  depends_on:
    redis:
      condition: service_healthy
  logging: *default-logging

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-environment
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      SERVICE_COMPONENT: api
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports: []
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  minio:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command:
      - server
      - /data
      - --address
      - :9000
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      MINIO_BROWSER: "off"
    expose:
      - "9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  audio-storage-init:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: "no"
    command:
      - python
      - -m
      - app.cli.init_audio_storage
    environment:
      ENVIRONMENT: fixture
      REPOSITORY_MODE: memory
      AUTH_MODE: local
      AUDIO_STORAGE_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      MINIO_SECURE: "false"
      AUDIO_MAX_OBJECT_BYTES: "${AUDIO_MAX_OBJECT_BYTES:-4294967296}"
      AUDIO_MULTIPART_PART_SIZE_BYTES: "${AUDIO_MULTIPART_PART_SIZE_BYTES:-16777216}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    depends_on:
      minio:
        condition: service_healthy
    logging: *default-logging

  worker-provider-api:
    <<: *worker-base
    environment:
      <<: *backend-environment
      SERVICE_COMPONENT: worker-provider-api
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - -Q
      - provider-api,youtube
      - --concurrency=1
      - --loglevel=INFO

  worker-provider-scrape:
    <<: *worker-base
    environment:
      <<: *backend-environment
      SERVICE_COMPONENT: worker-provider-scrape
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - -Q
      - provider-scrape,soundcloud,ftm
      - --concurrency=1
      - --loglevel=INFO
    cpus: 1.0
    mem_limit: 512m

  worker-process:
    <<: *worker-base
    environment:
      <<: *backend-environment
      SERVICE_COMPONENT: worker-process
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - -Q
      - process
      - --concurrency=2
      - --loglevel=INFO

  worker-beat:
    <<: *worker-base
    environment:
      <<: *backend-environment
      SERVICE_COMPONENT: worker-beat
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - beat
      - --schedule=/tmp/celerybeat-schedule
      - --loglevel=INFO

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: "${API_DOMAIN:?API_DOMAIN is required}"
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL is required}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

volumes:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
