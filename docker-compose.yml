name: syco23-setcrawler

services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000
      NUXT_PUBLIC_RUNTIME_MODE: local
      NUXT_PUBLIC_LOCAL_ROLE: admin
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ENVIRONMENT: local
      REPOSITORY_MODE: postgres
      AUTH_MODE: local
      LOCAL_USER_ROLE: admin
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/syco23
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      SCRAPER_USER_AGENT: "${SCRAPER_USER_AGENT:-syco23-setcrawler/0.1 (+contact: local@example.com)}"
      SCRAPER_REQUEST_DELAY_MS: "${SCRAPER_REQUEST_DELAY_MS:-5000}"
      FTM_SCRAPER_ENABLED: "${FTM_SCRAPER_ENABLED:-false}"
      FTM_MAX_PAGES_PER_RUN: "${FTM_MAX_PAGES_PER_RUN:-25}"
      PROVIDER_MODE: "${PROVIDER_MODE:-fixture}"
      PROVIDER_REQUEST_TIMEOUT_SECONDS: "${PROVIDER_REQUEST_TIMEOUT_SECONDS:-20}"
      PROVIDER_OUTPUT_LIMIT_BYTES: "${PROVIDER_OUTPUT_LIMIT_BYTES:-1048576}"
      YT_DLP_BIN: "${YT_DLP_BIN:-yt-dlp}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: syco23
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/000-supabase-compat.sql:/docker-entrypoint-initdb.d/000-supabase-compat.sql:ro
      - ./supabase/migrations/0001_init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./supabase/migrations/0003_indexes.sql:/docker-entrypoint-initdb.d/003-indexes.sql:ro
      - ./supabase/migrations/20260728192205_provider_jobs.sql:/docker-entrypoint-initdb.d/20260728192205-provider-jobs.sql:ro
      - ./supabase/migrations/20260729060000_final_release_fixes.sql:/docker-entrypoint-initdb.d/20260729060000-final-release-fixes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syco23"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker-youtube:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker -Q youtube --concurrency=1 --loglevel=INFO
    environment:
      ENVIRONMENT: local
      REPOSITORY_MODE: postgres
      AUTH_MODE: local
      LOCAL_USER_ROLE: admin
      DATABASE_URL: postgresql://postgres:postgres@db:5432/syco23
      REDIS_URL: redis://redis:6379/0
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      PROVIDER_MODE: "${PROVIDER_MODE:-fixture}"
      PROVIDER_REQUEST_TIMEOUT_SECONDS: "${PROVIDER_REQUEST_TIMEOUT_SECONDS:-20}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-soundcloud:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker -Q soundcloud --concurrency=1 --loglevel=INFO
    environment:
      ENVIRONMENT: local
      REPOSITORY_MODE: postgres
      AUTH_MODE: local
      LOCAL_USER_ROLE: admin
      DATABASE_URL: postgresql://postgres:postgres@db:5432/syco23
      REDIS_URL: redis://redis:6379/0
      YT_DLP_BIN: "${YT_DLP_BIN:-yt-dlp}"
      PROVIDER_MODE: "${PROVIDER_MODE:-fixture}"
      PROVIDER_OUTPUT_LIMIT_BYTES: "${PROVIDER_OUTPUT_LIMIT_BYTES:-1048576}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cpus: 1.0
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-ftm:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker -Q ftm --concurrency=1 --loglevel=INFO
    environment:
      ENVIRONMENT: local
      REPOSITORY_MODE: postgres
      AUTH_MODE: local
      LOCAL_USER_ROLE: admin
      DATABASE_URL: postgresql://postgres:postgres@db:5432/syco23
      REDIS_URL: redis://redis:6379/0
      SCRAPER_USER_AGENT: "${SCRAPER_USER_AGENT:-syco23-setcrawler/0.1 (+contact: local@example.com)}"
      SCRAPER_REQUEST_DELAY_MS: "${SCRAPER_REQUEST_DELAY_MS:-5000}"
      FTM_SCRAPER_ENABLED: "${FTM_SCRAPER_ENABLED:-false}"
      FTM_MAX_PAGES_PER_RUN: "${FTM_MAX_PAGES_PER_RUN:-25}"
      PROVIDER_MODE: "${PROVIDER_MODE:-fixture}"
      PROVIDER_REQUEST_TIMEOUT_SECONDS: "${PROVIDER_REQUEST_TIMEOUT_SECONDS:-20}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-process:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker -Q process --concurrency=2 --loglevel=INFO
    environment:
      ENVIRONMENT: local
      REPOSITORY_MODE: postgres
      AUTH_MODE: local
      LOCAL_USER_ROLE: admin
      DATABASE_URL: postgresql://postgres:postgres@db:5432/syco23
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  web_node_modules:
