name: syco23-setcrawler

services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000
      NUXT_PUBLIC_RUNTIME_MODE: local
      NUXT_PUBLIC_LOCAL_ROLE: admin
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ENVIRONMENT: local
      REPOSITORY_MODE: postgres
      AUTH_MODE: local
      LOCAL_USER_ROLE: admin
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/syco23
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      ARCHIVE_ORG_ENABLED: "${ARCHIVE_ORG_ENABLED:-false}"
      MIXCLOUD_ENABLED: "${MIXCLOUD_ENABLED:-false}"
      AUDIUS_ENABLED: "${AUDIUS_ENABLED:-false}"
      AUDIUS_API_BEARER_TOKEN: "${AUDIUS_API_BEARER_TOKEN:-}"
      RSS_ENABLED: "${RSS_ENABLED:-false}"
      RSS_TRUSTED_FEEDS_JSON: "${RSS_TRUSTED_FEEDS_JSON:-}"
      SCRAPER_USER_AGENT: "${SCRAPER_USER_AGENT:-syco23-setcrawler/0.1 (+contact: local@example.com)}"
      SCRAPER_REQUEST_DELAY_MS: "${SCRAPER_REQUEST_DELAY_MS:-5000}"
      FTM_SCRAPER_ENABLED: "${FTM_SCRAPER_ENABLED:-false}"
      FTM_MAX_PAGES_PER_RUN: "${FTM_MAX_PAGES_PER_RUN:-25}"
      PROVIDER_MODE: "${PROVIDER_MODE:-fixture}"
      PROVIDER_REQUEST_TIMEOUT_SECONDS: "${PROVIDER_REQUEST_TIMEOUT_SECONDS:-20}"
      PROVIDER_OUTPUT_LIMIT_BYTES: "${PROVIDER_OUTPUT_LIMIT_BYTES:-1048576}"
      YT_DLP_BIN: "${YT_DLP_BIN:-yt-dlp}"
      AUDIO_STORAGE_ENABLED: "${AUDIO_STORAGE_ENABLED:-false}"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-syco23-local}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-syco23-local-minio-change-me}"
      MINIO_SECURE: "false"
      AUDIO_MAX_OBJECT_BYTES: "${AUDIO_MAX_OBJECT_BYTES:-4294967296}"
      AUDIO_MULTIPART_PART_SIZE_BYTES: "${AUDIO_MULTIPART_PART_SIZE_BYTES:-16777216}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: syco23
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/000-supabase-compat.sql:/docker-entrypoint-initdb.d/000-supabase-compat.sql:ro
      - ./supabase/migrations/0001_init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./supabase/migrations/0003_indexes.sql:/docker-entrypoint-initdb.d/003-indexes.sql:ro
      - ./supabase/migrations/20260728192205_provider_jobs.sql:/docker-entrypoint-initdb.d/20260728192205-provider-jobs.sql:ro
      - ./supabase/migrations/20260729060000_final_release_fixes.sql:/docker-entrypoint-initdb.d/20260729060000-final-release-fixes.sql:ro
      - ./supabase/migrations/20260731110000_provider_source_schema.sql:/docker-entrypoint-initdb.d/20260731110000-provider-source-schema.sql:ro
      - ./supabase/migrations/20260801120000_provider_profile_scheduling.sql:/docker-entrypoint-initdb.d/20260801120000-provider-profile-scheduling.sql:ro
      - ./supabase/migrations/20260801150000_scheduler_hardening.sql:/docker-entrypoint-initdb.d/20260801150000-scheduler-hardening.sql:ro
      - ./supabase/migrations/20260801210000_provider_discovery_runtime.sql:/docker-entrypoint-initdb.d/20260801210000-provider-discovery-runtime.sql:ro
      - ./supabase/migrations/20260801230000_canonical_set_merge.sql:/docker-entrypoint-initdb.d/20260801230000-canonical-set-merge.sql:ro
      - ./supabase/migrations/20260802010000_rights_policy_foundation.sql:/docker-entrypoint-initdb.d/20260802010000-rights-policy-foundation.sql:ro
      - ./supabase/migrations/20260802030000_audio_acquisition_jobs.sql:/docker-entrypoint-initdb.d/20260802030000-audio-acquisition-jobs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syco23"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: syco23-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-syco23-local}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-syco23-local-minio-change-me}"
      MINIO_BROWSER: "off"
    expose:
      - "9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 20

  audio-storage-init:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: python -m app.cli.init_audio_storage
    restart: "no"
    environment:
      ENVIRONMENT: fixture
      REPOSITORY_MODE: memory
      AUTH_MODE: local
      AUDIO_STORAGE_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-syco23-local}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-syco23-local-minio-change-me}"
      MINIO_SECURE: "false"
      AUDIO_MAX_OBJECT_BYTES: "${AUDIO_MAX_OBJECT_BYTES:-4294967296}"
      AUDIO_MULTIPART_PART_SIZE_BYTES: "${AUDIO_MULTIPART_PART_SIZE_BYTES:-16777216}"
    depends_on:
      minio:
        condition: service_healthy

  worker-provider-api:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker -Q provider-api,youtube --concurrency=1 --loglevel=INFO
    environment:
      ENVIRONMENT: local
      REPOSITORY_MODE: postgres
      AUTH_MODE: local
      LOCAL_USER_ROLE: admin
      DATABASE_URL: postgresql://postgres:postgres@db:5432/syco23
      REDIS_URL: redis://redis:6379/0
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      ARCHIVE_ORG_ENABLED: "${ARCHIVE_ORG_ENABLED:-false}"
      MIXCLOUD_ENABLED: "${MIXCLOUD_ENABLED:-false}"
      AUDIUS_ENABLED: "${AUDIUS_ENABLED:-false}"
      AUDIUS_API_BEARER_TOKEN: "${AUDIUS_API_BEARER_TOKEN:-}"
      RSS_ENABLED: "${RSS_ENABLED:-false}"
      RSS_TRUSTED_FEEDS_JSON: "${RSS_TRUSTED_FEEDS_JSON:-}"
      PROVIDER_MODE: "${PROVIDER_MODE:-fixture}"
      PROVIDER_REQUEST_TIMEOUT_SECONDS: "${PROVIDER_REQUEST_TIMEOUT_SECONDS:-20}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-provider-scrape:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker -Q provider-scrape,soundcloud,ftm --concurrency=1 --loglevel=INFO
    environment:
      ENVIRONMENT: local
      REPOSITORY_MODE: postgres
      AUTH_MODE: local
      LOCAL_USER_ROLE: admin
      DATABASE_URL: postgresql://postgres:postgres@db:5432/syco23
      REDIS_URL: redis://redis:6379/0
      YT_DLP_BIN: "${YT_DLP_BIN:-yt-dlp}"
      PROVIDER_MODE: "${PROVIDER_MODE:-fixture}"
      PROVIDER_OUTPUT_LIMIT_BYTES: "${PROVIDER_OUTPUT_LIMIT_BYTES:-1048576}"
      SCRAPER_USER_AGENT: "${SCRAPER_USER_AGENT:-syco23-setcrawler/0.1 (+contact: local@example.com)}"
      SCRAPER_REQUEST_DELAY_MS: "${SCRAPER_REQUEST_DELAY_MS:-5000}"
      FTM_SCRAPER_ENABLED: "${FTM_SCRAPER_ENABLED:-false}"
      FTM_MAX_PAGES_PER_RUN: "${FTM_MAX_PAGES_PER_RUN:-25}"
      PROVIDER_REQUEST_TIMEOUT_SECONDS: "${PROVIDER_REQUEST_TIMEOUT_SECONDS:-20}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cpus: 1.0
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-process:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker -Q process --concurrency=2 --loglevel=INFO
    environment:
      ENVIRONMENT: local
      REPOSITORY_MODE: postgres
      AUTH_MODE: local
      LOCAL_USER_ROLE: admin
      DATABASE_URL: postgresql://postgres:postgres@db:5432/syco23
      REDIS_URL: redis://redis:6379/0
      ARCHIVE_ORG_ENABLED: "${ARCHIVE_ORG_ENABLED:-false}"
      MIXCLOUD_ENABLED: "${MIXCLOUD_ENABLED:-false}"
      AUDIUS_ENABLED: "${AUDIUS_ENABLED:-false}"
      AUDIUS_API_BEARER_TOKEN: "${AUDIUS_API_BEARER_TOKEN:-}"
      RSS_ENABLED: "${RSS_ENABLED:-false}"
      RSS_TRUSTED_FEEDS_JSON: "${RSS_TRUSTED_FEEDS_JSON:-}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-beat:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO
    environment:
      ENVIRONMENT: local
      REPOSITORY_MODE: postgres
      AUTH_MODE: local
      LOCAL_USER_ROLE: admin
      DATABASE_URL: postgresql://postgres:postgres@db:5432/syco23
      REDIS_URL: redis://redis:6379/0
      JOB_CLAIM_TTL_SECONDS: "${JOB_CLAIM_TTL_SECONDS:-300}"
      JOB_REDRIVE_INTERVAL_SECONDS: "${JOB_REDRIVE_INTERVAL_SECONDS:-60}"
      JOB_REDRIVE_BATCH_SIZE: "${JOB_REDRIVE_BATCH_SIZE:-100}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  web_node_modules:
